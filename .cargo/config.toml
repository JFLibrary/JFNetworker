# What a build script cannot set (README.md of the crate jflib).  rust-lld comes with rustup.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.aarch64-pc-windows-msvc]
linker = "rust-lld"

# Linux needs nothing here since JFLib 0.2.1: a program links against glibc through cc, as every
# Rust program does, so `cargo run` is all it takes.  A program that should be one static file
# takes these two lines, and is then always built with --target x86_64-unknown-linux-gnu, also
# on Linux (the flags must not reach the build scripts and proc macros):
# [target.x86_64-unknown-linux-gnu]
# rustflags = ["-C", "target-feature=+crt-static", "-C", "relocation-model=static"]
